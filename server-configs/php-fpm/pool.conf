; bqckup-master optimized PHP-FPM pool configuration
; File: /etc/php-fpm.d/bqckup-master.conf (or equivalent pool directory)
;
; This config is optimized for a Laravel application running on
; a server with limited RAM. It uses dynamic process management
; to prevent memory exhaustion and 502 Bad Gateway errors.

[bqckup-master]

user = panel
group = panel

listen = /run/php/php-fpm-bqckup.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
pm.process_idle_timeout = 10s

php_admin_value[memory_limit] = 128M
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 64M
php_admin_value[max_execution_time] = 120
php_admin_value[max_input_time] = 120
php_admin_value[error_log] = /home/panel/public_html/storage/logs/php-error.log

php_flag[display_errors] = off
php_flag[log_errors] = on

; OPcache settings for Laravel performance
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.memory_consumption] = 64
php_admin_value[opcache.interned_strings_buffer] = 8
php_admin_value[opcache.max_accelerated_files] = 10000
php_admin_value[opcache.validate_timestamps] = 1
php_admin_value[opcache.revalidate_freq] = 2
php_admin_value[opcache.save_comments] = 1

; Slow log for debugging
slowlog = /var/log/php-fpm/bqckup-master-slow.log
request_slowlog_timeout = 5s

; Health check
ping.path = /fpm-ping
ping.response = pong

; Status page (restrict access in production)
pm.status_path = /fpm-status
