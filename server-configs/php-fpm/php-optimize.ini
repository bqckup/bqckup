; bqckup-master optimized PHP settings
; File: /etc/php.d/99-bqckup-master.ini (or equivalent)
;
; These settings fix the "Allowed memory size exhausted" error
; while keeping memory usage within server limits.

[PHP]
memory_limit = 128M

; Error handling
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
error_log = /home/panel/public_html/storage/logs/php-error.log

; Performance
max_execution_time = 120
max_input_time = 120
post_max_size = 64M
upload_max_filesize = 64M
max_file_uploads = 20

; OPcache - critical for Laravel performance
[opcache]
opcache.enable = 1
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.save_comments = 1
opcache.fast_shutdown = 1

; Realpath cache for better file performance
realpath_cache_size = 4096K
realpath_cache_ttl = 600
