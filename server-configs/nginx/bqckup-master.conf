server {
    listen 80;
    server_name _;

    root /home/panel/public_html/public;
    index index.php index.html;

    charset utf-8;

    client_max_body_size 64M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php-fpm-bqckup.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_read_timeout 120;
        fastcgi_send_timeout 120;
        fastcgi_connect_timeout 60;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        fastcgi_param PHP_VALUE "memory_limit = 128M";
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/bqckup-master-access.log;
    error_log /var/log/nginx/bqckup-master-error.log;
}
