bqckup:
  name: sqlite_test
  enabled: yes
  path:
    - /var/www/html/sqlite_site
  database:
    enabled: yes
    type: sqlite
    name: /var/data/app.sqlite
  options:
    storage: test_storage
    interval: daily
    retention: '7'
    follow_symlink: no
    save_locally: no
    notification_email: admin@example.com
    provider: s3