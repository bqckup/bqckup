bqckup:
  name: single_db_test
  enabled: yes
  path:
    - /var/www/html/single_site
  database:
    enabled: yes
    type: mysql
    host: localhost
    port: 3306
    user: single_user
    password: single_pass
    name: single_database
  options:
    storage: test_storage
    interval: daily
    retention: '7'
    follow_symlink: no
    save_locally: no
    notification_email: admin@example.com
    provider: s3
